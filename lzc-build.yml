icon: ./icon.png
buildscript: |
  set -eu
  rm -rf dist/content
  npm --prefix frontend ci --include=dev --no-audit --no-fund
  npm --prefix frontend run build
  mkdir -p dist/content
  cp -R web dist/content/web
  CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o dist/content/maoyan ./cmd/maoyan-hub
contentdir: ./dist/content
