application:
  subdomain: maoyan
  background_task: true
  multi_instance: false
  routes:
    - /=http://maoyan:8080
  health_check:
    test_url: http://maoyan:8080/api/v1/health
    start_period: 600s
    timeout: 10s

services:
  maoyan:
    image: registry.cn-shanghai.aliyuncs.com/wtjking/lazycat-maoyan:1.17.0@sha256:f74168d40e79aaf912a3349d41e744163a7d0d1f2885f17f3971b575a3372c34
    environment:
      - MAOYAN_ADDR=:8080
      - MAOYAN_COLLECTOR_ADDR=:8443
      - MAOYAN_DATA_DIR=/lzcapp/var/data
      - MAOYAN_WEB_DIR=/opt/maoyan/web
      - MAOYAN_DOCKER_STATS_BATCH_SIZE=8
      - MAOYAN_DOCKER_STATS_CONCURRENCY=1
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "3", "-O", "/dev/null", "http://127.0.0.1:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 600s
ext_config:
  permissions:
    - PERM_LZC_DOCKER_ADMIN
