application:
  subdomain: maoyan
  background_task: true
  multi_instance: false
  routes:
    - /=http://maoyan:8080
  health_check:
    test_url: http://maoyan:8080/api/v1/health
    start_period: 120s
    timeout: 10s

services:
  maoyan:
    image: registry.cn-shanghai.aliyuncs.com/wtjking/lazycat-maoyan:1.15.0@sha256:9167ac15710b039a874e0abbc8e0f3b459db8fa2b4f0132d6eda4a288439d4b2
    environment:
      - MAOYAN_ADDR=:8080
      - MAOYAN_COLLECTOR_ADDR=:8443
      - MAOYAN_DATA_DIR=/lzcapp/var/data
      - MAOYAN_WEB_DIR=/opt/maoyan/web
      - MAOYAN_DOCKER_STATS_BATCH_SIZE=8
      - MAOYAN_DOCKER_STATS_CONCURRENCY=1
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "3", "-O", "/dev/null", "http://127.0.0.1:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
ext_config:
  permissions:
    - PERM_LZC_DOCKER_ADMIN
