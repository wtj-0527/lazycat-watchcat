application:
  subdomain: maoyan
  background_task: true
  multi_instance: false
  routes:
    - /=http://maoyan:8080
  health_check:
    test_url: http://maoyan:8080/api/v1/health
    start_period: 600s
    timeout: 10s

services:
  maoyan:
    image: registry.cn-shanghai.aliyuncs.com/wtjking/lazycat-maoyan:1.16.2@sha256:aeda5e0b233ae1163256ee3a5d60ed6a5cacb24be948971845688b24f26d22df
    environment:
      - MAOYAN_ADDR=:8080
      - MAOYAN_COLLECTOR_ADDR=:8443
      - MAOYAN_DATA_DIR=/lzcapp/var/data
      - MAOYAN_WEB_DIR=/opt/maoyan/web
      - MAOYAN_DOCKER_STATS_BATCH_SIZE=8
      - MAOYAN_DOCKER_STATS_CONCURRENCY=1
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "3", "-O", "/dev/null", "http://127.0.0.1:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 600s
ext_config:
  permissions:
    - PERM_LZC_DOCKER_ADMIN
